# Minimal single-node Elasticsearch cluster, per Elastic's own ECK quickstart shape.
# node.store.allow_mmap: false avoids raising the host's vm.max_map_count, which is
# a common first-run friction point on Docker Desktop / minikube (worth noting in
# the Task 1 writeup if you hit it with this turned on).
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: quickstart
spec:
  version: 8.15.0
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
